# 美股市场专属配置
# 继承 base.yaml，覆盖/扩展美股相关项
# 环境说明：本机代理仅放行腾讯 web.ifzq.gtimg.cn（us 前缀可出美股日线），
# akshare/东财经代理不可用，故美股 primary 用 tencent。

market: "us_stocks"

# ===== 美股数据源 =====
data_sources:
  # 腾讯负责可用的在线数据；历史不足时回退已有 MT5 Parquet。
  primary: "tencent"
  fallback: ["local_parquet"]
  tencent: {}
  local_parquet:
    root: "data"
    time_mode: "auto"
    groups:
      us_stocks:
        subdir: "MT5_K线数据"
        pattern: "{symbol}_{TF}.parquet"
        symbol_norm: "symbol"
        tf_map: { "5m": "M5", "15m": "M15", "1h": "H1", "1d": "D1" }
        time_mode: "unix_seconds"
