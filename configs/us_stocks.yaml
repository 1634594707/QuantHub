# 美股市场专属配置
# 继承 base.yaml，覆盖/扩展美股相关项
# 腾讯负责实时行情；其美股历史不足时使用 Yahoo Chart 公共接口回退。

market: "us_stocks"

# ===== 美股数据源 =====
data_sources:
  # 腾讯历史不足时先回退 Yahoo，离线环境最终回退已有 MT5 Parquet。
  primary: "tencent"
  fallback: ["yahoo", "local_parquet"]
  tencent: {}
  yahoo: {}
  local_parquet:
    root: "data"
    time_mode: "auto"
    groups:
      us_stocks:
        subdir: "MT5_K线数据"
        pattern: "{symbol}_{TF}.parquet"
        symbol_norm: "symbol"
        tf_map: { "5m": "M5", "15m": "M15", "1h": "H1", "1d": "D1" }
        time_mode: "unix_seconds"
