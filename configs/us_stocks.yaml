# 美股市场专属配置
# 继承 base.yaml，覆盖/扩展美股相关项
# 默认只使用腾讯 primary；历史不足或请求失败时明确返回失败，不切换供应商或本地存储。

market: "us_stocks"

# ===== 美股数据源 =====
data_sources:
  primary: "tencent"
  tencent: {}
  yahoo: {}
  local_parquet:
    root: "data"
    time_mode: "auto"
    groups:
      us_stocks:
        subdir: "MT5_K线数据"
        pattern: "{symbol}_{TF}.parquet"
        symbol_norm: "symbol"
        tf_map: { "5m": "M5", "15m": "M15", "1h": "H1", "1d": "D1", "1w": "D1" }
        time_mode: "unix_seconds"
