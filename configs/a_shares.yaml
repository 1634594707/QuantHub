# A股市场专属配置
# 继承 base.yaml，覆盖/扩展 A股相关项

market: "a_shares"

# ===== A股数据源 =====
data_sources:
  # 在线源优先：当前环境 akshare 经系统代理访问东财接口必失败（ProxyError），
  # 腾讯接口可正常穿透代理，故以 tencent 为日/周 K 线 primary。
  # 这些接口均为 bar snapshot，不是逐笔实时；盘中形成中 K 线不得用于研究信号。
  # 东方财富直连负责个股新闻；新浪财经提供独立新闻兜底，akshare 为兼容备用。
  primary: "tencent"
  fallback: ["eastmoney", "sina_news", "akshare", "local_parquet"]
  akshare: {}
  tencent: {}
  local_parquet:
    root: "data"
    time_mode: "auto"                      # auto|unix_seconds|ordinal
    groups:
      a_stocks:                            # 个股：data/parquet/stocks/{code}_{N}min.parquet
        subdir: "parquet/stocks"
        pattern: "{code}_{tf}min.parquet"
        symbol_norm: "code"                # 去交易所后缀（000001.SZ → 000001）
        # 注意：{tf} 捕获的是裸 token（"15"），故映射到 5/15/60，不是 5min/15min/60min
        tf_map: { "5m": "5", "15m": "15", "1h": "60" }
        time_mode: "ordinal"               # time 为非 unix 顺序整数，datetime 置 NaT 保序
      a_indices:                           # 指数：data/parquet/indices/idx_{code}_{N}min.parquet
        subdir: "parquet/indices"
        pattern: "idx_{code}_{tf}min.parquet"
        symbol_norm: "code"
        tf_map: { "5m": "5", "15m": "15", "1h": "60" }
        time_mode: "ordinal"
        warn: true                          # ⚠️ 实测 OHLC 为负/volume=int64 最小值，疑似损坏，谨慎使用
  eastmoney:
    push2_host: "push2.eastmoney.com"
  sina_news: {}

# ===== 交易时间 =====
trading_hours:
  morning: { start: "09:30", end: "11:30" }
  afternoon: { start: "13:00", end: "15:00" }
  timezone: "Asia/Shanghai"

# ===== A股策略模块开关 =====
modules:
  sentiment:
    enabled: true
    # FinBERT2 本地权重目录（相对 models_dir）
    model_dir: "finbert2-base-sentiment-3class-stage2"
    news_source: "eastmoney"
    daily_scan_cron: "0 18 * * 1-5"       # 每个交易日 18:00 扫描
  news_analyzer:
    enabled: true
    # 初始情绪分析复用 modules.sentiment 的 SentimentAnalyzer（transformers/FinBERT2 → snownlp → 关键词）
    # 可选 API 增强：配置 DEEPSEEK_API_KEY 环境变量后自动启用 NER/主题/摘要结构化分析
    api_provider: "deepseek"              # 可选 API 提供方（未配置 Key 时自动跳过）
    batch_size: 5                         # API 增强单批最大条数
    max_title_chars: 200                  # 标题截断长度（控制 prompt token）
  news_scanner:
    enabled: true
    scan_interval_minutes: 30
    cron: "*/30 * * * *"                  # 每 30 分钟扫描一次
  selector:
    enabled: true
    cron: "0 17 * * 1-5"                  # 收盘前选股
  supertrend:
    enabled: true
    default_tf: "daily"                   # daily | 4h
    cron: "30 15 * * 1-5"                 # 收盘后生成每日趋势信号
  morning_brief:
    enabled: true
    cron: "30 8 * * 1-5"                  # 开盘前 8:30 生成
  perks_monitor:
    enabled: true
    cron: "0 9 * * *"                     # 每日 9:00 检查公告
    push_channels: ["wecom"]
  realtime_analyzer:
    enabled: false                       # 研究模式开关（实时盘口 + 深度研报）
    cron: "0 20 * * 1-5"                  # 盘后研报（启用后生效）
    default_codes: ["600519", "000001"]    # 默认分析标的
    with_kline: true
    with_indices: true
    kline_days: 60

# ===== 股票池 =====
stock_pool:
  default_universe: "hs300"               # hs300 | zz500 | zz1000 | custom
  custom_path: null
