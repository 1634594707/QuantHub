[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-scheduler"
version = "0.4.0"
description = "QuantHub APScheduler 定时任务"
requires-python = ">=3.11,<3.13"
dependencies = ["quanthub-core", "apscheduler>=3.10"]

[tool.hatch.build.targets.wheel]
packages = ["."]
