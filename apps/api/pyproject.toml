[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-api"
version = "0.1.0"
description = "QuantHub 统一 API 网关：单端口前端 / 企微 / 调度器调用全部已注册策略"
requires-python = ">=3.11,<3.13"
dependencies = [
    "quanthub-core",
    "quanthub-apps-pa-agent",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
]

[tool.uv.sources]
quanthub-core = { workspace = true }
quanthub-apps-pa-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
