[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-api"
version = "0.3.0"
description = "QuantHub 统一 API 网关：单端口前端 / 企微 / 调度器调用全部已注册策略"
requires-python = ">=3.11,<3.13"
dependencies = [
    "quanthub-core",
    "quanthub-apps-pa-agent",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "openai>=1.40",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
quanthub-core = { workspace = true }
quanthub-apps-pa-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
