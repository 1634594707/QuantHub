[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-dashboard"
version = "0.1.0"
description = "QuantHub Streamlit 统一看板"
requires-python = ">=3.11,<3.13"
dependencies = ["quanthub-core", "streamlit>=1.32", "plotly>=5.20"]

[tool.hatch.build.targets.wheel]
packages = ["."]
