name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend component tests
        run: npm test
      - name: Frontend production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install web API dependencies
        run: uv sync --locked --group test

      - name: Byte-compile backend
        run: uv run python -m compileall -q apps/api apps/dispatcher apps/scheduler core strategies

      - name: Import FastAPI application
        run: uv run python -c "from apps.api.main import app; assert app.title"

      - name: Product workflow tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

  container:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build --tag quanthub:ci .
