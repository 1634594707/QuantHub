name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend component tests
        run: npm test
      - name: Frontend production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install web API dependencies
        run: uv sync --locked --group test

      - name: Byte-compile backend
        run: uv run python -m compileall -q apps/api apps/dispatcher apps/scheduler core strategies

      - name: Import FastAPI application
        run: uv run python -c "from apps.api.main import app; assert app.title"

      - name: Backend test suite
        run: uv run --frozen python -m pytest -q

  container:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build --tag quanthub:ci .
      - name: Smoke-test application image
        shell: bash
        run: |
          docker run --detach --name quanthub-ci --publish 8080:8080 quanthub:ci
          cleanup() {
            docker logs quanthub-ci || true
            docker rm --force quanthub-ci || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/evaluate >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null
