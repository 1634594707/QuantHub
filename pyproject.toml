[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub"
version = "0.1.0"
description = "QuantHub: 分层单体仓库，整合 A股研究 + 加密交易 + AI 分析（统一底座 + 插件式策略 + Streamlit 看板）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "QuantHub" }]
dependencies = [
    # 统一基础库（所有模块共享）
    "requests>=2.31",
    "urllib3>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tenacity>=8.2",       # 统一重试
    "loguru>=0.7",         # 统一日志
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 按市场/能力分组，按需安装
a_shares = [
    "akshare>=1.16",
    "snownlp>=0.12",
    "tqdm>=4.66",
    "pyarrow>=14",
]
crypto = [
    "ccxt>=4.3",
    "aiohttp>=3.9",
]
ai = [
    "openai>=1.40",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
]
backtest = [
    "backtrader>=1.9.78",
]
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.20",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# 重依赖（按需安装，避免污染基础环境）
heavy-torch = [
    "torch>=2.0",
    "transformers>=4.40",
]
heavy-solana = [
    "solders>=0.18",
    "solana>=0.30",
    "base58>=2.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[tool.uv.workspace]
# uv workspace: 每个成员独立 pyproject.toml，但共享单一虚拟环境
members = [
    "core",
    "apps/dashboard",
    "apps/dispatcher",
    "apps/scheduler",
    "apps/api",
    "strategies/a_shares/sentiment",
    "strategies/a_shares/news_scanner",
    "strategies/a_shares/selector",
    "strategies/a_shares/supertrend",
    "strategies/a_shares/morning_brief",
    "strategies/a_shares/perks_monitor",
    "strategies/a_shares/realtime_analyzer",
    "strategies/crypto/okx_grid",
    "strategies/crypto/alphagpt",
    "strategies/ai_analysis/pa_agent",
    "strategies/mt5/alphamaster",
    "apps/pa_agent",
]

[tool.uv.sources]
# workspace 内部包互引
quanthub-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "strategies"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文代码库：忽略全角标点误报（prompt 模板/注释里的 ：；，（） 是故意的）
ignore = [
    "E501",          # 行过长（已用 line-length=100 把控）
    "RUF001", "RUF002", "RUF003",  # 全角标点误报（中文 prompt/注释故意使用）
    # --- 二期收紧的技术债（当前为务实基线，避免首日卡死 207 个风格项）---
    "E402",          # 模块级 import 不在文件顶部（策略插件常见条件导入）
    "E741",          # 歧义变量名 l/I/O（低风险）
    "SIM102", "SIM103", "SIM105", "SIM108",  # 风格类简化建议
    "RUF005", "RUF046", "RUF059",            # 风格类
    "F841",          # 局部变量赋值未使用（多为占位）
    "F821",          # 注解前向引用（BacktestResult/AIProviderSettings 等，配 future annotations 无害）
    "B904",          # raise ... from（良好实践，二期逐步补全）
    # --- 二期收紧的风格类（当前为务实基线）---
    "SIM201",        # not x == y → x != y
    "SIM110",        # for-loop return all() 简化
    "SIM117",        # 嵌套 with 合并
    "RUF034",        # 无用 if-else 分支
    "RUF100",        # 无用 noqa（由 ruff --fix 清理）
    "B007",          # 循环变量未使用
    "B905",          # zip 缺 strict=
    "UP042",         # str+Enum 字符串枚举（Python 推荐写法，属误报）
]

# __init__.py 通常用于再导出，F401 在其中属预期行为
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
