[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub"
version = "0.1.0"
description = "QuantHub: 分层单体仓库，整合 A股研究 + 加密交易 + AI 分析（统一底座 + 插件式策略 + Streamlit 看板）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "QuantHub" }]
dependencies = [
    # 统一基础库（所有模块共享）
    "requests>=2.31",
    "urllib3>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tenacity>=8.2",       # 统一重试
    "loguru>=0.7",         # 统一日志
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 按市场/能力分组，按需安装
a_shares = [
    "akshare>=1.16",
    "snownlp>=0.12",
    "tqdm>=4.66",
    "pyarrow>=14",
]
crypto = [
    "ccxt>=4.3",
    "aiohttp>=3.9",
]
ai = [
    "openai>=1.40",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
]
backtest = [
    "backtrader>=1.9.78",
]
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.20",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# 重依赖（按需安装，避免污染基础环境）
heavy-torch = [
    "torch>=2.0",
    "transformers>=4.40",
]
heavy-solana = [
    "solders>=0.18",
    "solana>=0.30",
    "base58>=2.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.uv.workspace]
# uv workspace: 每个成员独立 pyproject.toml，但共享单一虚拟环境
members = [
    "core",
    "apps/dashboard",
    "apps/dispatcher",
    "apps/scheduler",
    "apps/api",
    "strategies/a_shares/sentiment",
    "strategies/a_shares/news_scanner",
    "strategies/a_shares/selector",
    "strategies/a_shares/supertrend",
    "strategies/a_shares/morning_brief",
    "strategies/a_shares/perks_monitor",
    "strategies/a_shares/realtime_analyzer",
    "strategies/crypto/okx_grid",
    "strategies/crypto/alphagpt",
    "strategies/ai_analysis/pa_agent",
    "strategies/mt5/alphamaster",
    "apps/pa_agent",
]

[tool.uv.sources]
# workspace 内部包互引
quanthub-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "strategies"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
