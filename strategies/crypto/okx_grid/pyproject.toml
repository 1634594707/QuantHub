[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-okx-grid"
version = "0.1.1"
description = "OKX 永续多因子轮动网格"
requires-python = ">=3.11,<3.13"
dependencies = ["quanthub-core", "ccxt>=4.3", "pandas>=2.2", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["."]
