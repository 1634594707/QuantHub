[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-alphagpt"
version = "0.3.0"
description = "AlphaGPT 因子 DSL 加 链上执行"
requires-python = ">=3.11,<3.13"
dependencies = ["quanthub-core", "torch>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
solana = ["solders>=0.18", "solana>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["."]
