[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-sentiment"
version = "0.1.0"
description = "A股 FinBERT2 中文新闻情绪系统"
requires-python = ">=3.11,<3.13"
dependencies = ["quanthub-core", "transformers>=4.40", "torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]
