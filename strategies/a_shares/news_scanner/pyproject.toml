[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quanthub-news-scanner"
version = "0.1.0"
description = "A股新闻情绪扫描"
requires-python = ">=3.11,<3.13"
dependencies = ["quanthub-core", "openai>=1.40", "tiktoken>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["."]
